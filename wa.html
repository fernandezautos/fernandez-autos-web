<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fernández Autos — Contacto</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Audiowide&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: Helvetica Neue, Arial, sans-serif;
      background: #f4f2ec;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 32px 20px;
    }

    /* ── LOGO ── */
    .logo {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 32px;
    }
    .logo-fa {
      font-family: 'Audiowide', sans-serif;
      font-size: 22px;
      color: #0e0d0b;
      line-height: 1;
    }
    .logo-divider {
      width: 1px;
      height: 28px;
      background: #1a4a8a;
    }
    .logo-right {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .logo-name {
      font-family: Georgia, serif;
      font-size: 10px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: #0e0d0b;
    }
    .logo-city {
      font-size: 9px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: #7a7870;
    }

    /* ── CARD ── */
    .card {
      background: #fff;
      border: 1px solid #e2dfd5;
      border-radius: 6px;
      padding: 32px 28px;
      width: 100%;
      max-width: 400px;
    }

    .card-title {
      font-family: Georgia, serif;
      font-size: 20px;
      color: #0e0d0b;
      margin-bottom: 6px;
    }
    .card-sub {
      font-size: 13px;
      color: #7a7870;
      line-height: 1.5;
      margin-bottom: 24px;
    }

    /* ── FORM ── */
    .field {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-bottom: 14px;
    }
    label {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #4a4a48;
    }
    input {
      border: 1px solid #e2dfd5;
      border-radius: 4px;
      padding: 11px 14px;
      font-size: 15px;
      font-family: Helvetica Neue, Arial, sans-serif;
      color: #0e0d0b;
      background: #faf9f6;
      outline: none;
      transition: border-color 0.15s;
      -webkit-appearance: none;
    }
    input:focus {
      border-color: #1a4a8a;
      background: #fff;
    }
    input::placeholder { color: #b0ada6; }
    input.error { border-color: #c0392b; }

    .error-msg {
      font-size: 11px;
      color: #c0392b;
      display: none;
    }
    .error-msg.visible { display: block; }

    /* ── BUTTON ── */
    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      padding: 14px;
      margin-top: 8px;
      background: #25d366;
      color: #fff;
      font-size: 15px;
      font-weight: 700;
      font-family: Helvetica Neue, Arial, sans-serif;
      letter-spacing: 0.01em;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      transition: background 0.15s, opacity 0.15s;
    }
    .btn:hover { background: #1ebe5b; }
    .btn:disabled { opacity: 0.6; cursor: not-allowed; }

    /* ── LOADING ── */
    .loading {
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      padding: 20px 0 8px;
    }
    .loading.visible { display: flex; }
    .spinner {
      width: 30px;
      height: 30px;
      border: 2px solid #e2dfd5;
      border-top-color: #1a4a8a;
      border-radius: 50%;
      animation: spin 0.85s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loading-text {
      font-size: 13px;
      color: #7a7870;
    }

    /* ── FOOTER ── */
    .footer {
      margin-top: 24px;
      font-size: 11px;
      color: #b0ada6;
      text-align: center;
      line-height: 1.6;
    }
  </style>
</head>
<body>

  <div class="logo">
    <span class="logo-fa">FA</span>
    <div class="logo-divider"></div>
    <div class="logo-right">
      <span class="logo-name">Fernández Autos</span>
      <span class="logo-city">Mar del Plata</span>
    </div>
  </div>

  <div class="card">
    <h1 class="card-title">Consultá por WhatsApp</h1>
    <p class="card-sub">Completá tus datos y te conectamos con un asesor al instante.</p>

    <div class="field">
      <label for="nombre">Nombre</label>
      <input type="text" id="nombre" placeholder="Tu nombre" autocomplete="given-name" inputmode="text">
      <span class="error-msg" id="err-nombre">Ingresá tu nombre.</span>
    </div>

    <div class="field">
      <label for="apellido">Apellido</label>
      <input type="text" id="apellido" placeholder="Tu apellido" autocomplete="family-name" inputmode="text">
      <span class="error-msg" id="err-apellido">Ingresá tu apellido.</span>
    </div>

    <div class="field">
      <label for="telefono">Teléfono</label>
      <input type="tel" id="telefono" placeholder="Ej: 2236123456" autocomplete="tel" inputmode="numeric">
      <span class="error-msg" id="err-telefono">Ingresá un teléfono válido.</span>
    </div>

    <div class="loading" id="loading">
      <div class="spinner"></div>
      <span class="loading-text">Conectando con un asesor...</span>
    </div>

    <button class="btn" id="btnEnviar" onclick="enviar()">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
      </svg>
      Hablar por WhatsApp
    </button>
  </div>

  <p class="footer">
    Tus datos son confidenciales y no serán compartidos<br>con terceros.
  </p>

  <script>
    const SUPABASE_URL = 'https://bjgkmrgkgjpydpanewsa.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJqZ2ttcmdrZ2pweWRwYW5ld3NhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc0ODU4NjgsImV4cCI6MjA5MzA2MTg2OH0.DLfBLH9H3UGSh1ISzylt4lLc6pExr6YOyy0sb-cbZec';
    const FALLBACK_NUM = '5492236249445';

    function limpiar(id) {
      document.getElementById(id).classList.remove('error');
      document.getElementById('err-' + id).classList.remove('visible');
    }
    ['nombre','apellido','telefono'].forEach(id =>
      document.getElementById(id).addEventListener('input', () => limpiar(id))
    );

    async function enviar() {
      const nombre   = document.getElementById('nombre').value.trim();
      const apellido = document.getElementById('apellido').value.trim();
      const telefono = document.getElementById('telefono').value.trim();

      let valido = true;
      if (nombre.length < 2) {
        document.getElementById('nombre').classList.add('error');
        document.getElementById('err-nombre').classList.add('visible');
        valido = false;
      }
      if (apellido.length < 2) {
        document.getElementById('apellido').classList.add('error');
        document.getElementById('err-apellido').classList.add('visible');
        valido = false;
      }
      if (telefono.replace(/\D/g,'').length < 8) {
        document.getElementById('telefono').classList.add('error');
        document.getElementById('err-telefono').classList.add('visible');
        valido = false;
      }
      if (!valido) return;

      const btn = document.getElementById('btnEnviar');
      const loading = document.getElementById('loading');
      btn.style.display = 'none';
      loading.classList.add('visible');

      const nombreCompleto = `${nombre} ${apellido}`;
      let numeroDestino = FALLBACK_NUM;
      let mensaje = `Hola, soy ${nombreCompleto}, los contacto desde Instagram para consultar sobre un auto.`;

      try {
        const res = await fetch(`${SUPABASE_URL}/functions/v1/whatsapp-rotator`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${SUPABASE_KEY}`
          },
          body: JSON.stringify({
            nombre: nombreCompleto,
            telefono: telefono,
            contexto: 'instagram'
          })
        });

        if (res.ok) {
          const data = await res.json();
          if (data.numero_vendedor) numeroDestino = data.numero_vendedor;
          if (data.mensaje) mensaje = data.mensaje;
        }
      } catch (e) {
        // silencioso, usa fallback
      }

      window.location.href = `https://wa.me/${numeroDestino}?text=${encodeURIComponent(mensaje)}`;
    }
  </script>

</body>
</html>
